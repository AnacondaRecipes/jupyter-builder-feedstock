{% set name = "jupyter-builder" %}
{% set version = "1.2.3" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/jupyter_builder-{{ version }}.tar.gz
  sha256: 01aba6794eb9b19e0e29ae21137ca60ba4135c70347d4b9f664a586822b8c809

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: {{ name }}
    build:
      script: python -m pip install . -vv --no-deps --no-build-isolation
      entry_points:
        - jupyter-builder = jupyter_builder.main:main
        - jlpm = jupyter_builder.jlpm:main
    requirements:
      host:
        - pip
        - python
        - hatchling >=1.21.1
        - hatch-nodejs-version >=0.3.2
      run:
        - python
        - jupyter_core
        - traitlets
        - tomli  # [py<311]
      run_constrained:
        # range mirrors the upstream fallback minimum:
        # https://github.com/jupyterlab/jupyter-builder/blob/v1.2.3/jupyter_builder/federated_extensions.py#L337
        - nodejs >=20.19,<21|>=22.12
    test:
      imports:
        - jupyter_builder
      requires:
        - pip
      commands:
        - pip check
        - jupyter-builder --help

  - name: {{ name }}-with-nodejs
    build:
      noarch: generic
    requirements:
      run:
        - {{ pin_subpackage(name, exact=True) }}
        # see upstream fallback range cited in the base output above
        - nodejs >=20.19,<21|>=22.12
    test:
      source_files:
        - tests/
      requires:
        - pytest >=7.0
      commands:
        - jlpm --help
        - pytest -vv --tb=long --color=yes -m "not slow"

about:
  home: https://jupyter.org
  summary: JupyterLab build tools
  description: Build tools shared by JupyterLab and Jupyter Notebook extensions.
  doc_url: https://jupyterlab.readthedocs.io
  dev_url: https://github.com/jupyterlab/jupyter-builder
  license: BSD-3-Clause AND MIT AND ISC
  license_family: BSD
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES/semver.LICENSE.txt
    - THIRD_PARTY_LICENSES/yarn.js.LICENSE.txt

extra:
  recipe-maintainers:
    - darshan808
    - krassowski
    - bollwyvl
  skip-lints:
    - missing_python
    - missing_python_build_tool
    - missing_pip_check
    - missing_imports_or_run_test_py
    - wrong_output_script_key
